name: Update latest image tag

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release image tag to promote to latest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-latest
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/golang-tongsuo
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}$ ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy release manifest to latest
        shell: bash
        run: |
          digest=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')
          docker buildx imagetools create --tag "${REGISTRY_IMAGE}:latest" "${REGISTRY_IMAGE}@${digest}"
          latest_digest=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest" --format '{{.Manifest.Digest}}')
          test "$digest" = "$latest_digest"
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest"
