name: Sync image aliases

on:
  workflow_run:
    workflows: [Build and publish Docker image]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Reconcile all published releases, so coalescing pending runs is safe.
# No other workflow may write the floating image tags.
concurrency:
  group: sync-image-aliases
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/golang-tongsuo
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test alias selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync series tags and latest
        run: python3 .github/scripts/sync_image_tags.py "$REGISTRY_IMAGE" --apply
